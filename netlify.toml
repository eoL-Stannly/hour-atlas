[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# The site began life as a destination guide. Keep the old URLs alive.
[[redirects]]
  from = "/destinations/*"
  to = "/journal/:splat"
  status = 301

[[redirects]]
  from = "/stays"
  to = "/contact-sheet/"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
