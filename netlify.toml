[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# The site began life as a destination guide with flat URLs. Map the old
# ones onto the places they became.
[[redirects]]
  from = "/destinations/santorini"
  to = "/destinations/europe/greece/santorini/"
  status = 301

[[redirects]]
  from = "/destinations/lofoten"
  to = "/destinations/europe/norway/lofoten/"
  status = 301

[[redirects]]
  from = "/destinations/fiordland"
  to = "/destinations/oceania/new-zealand/fiordland/"
  status = 301

[[redirects]]
  from = "/destinations/male-atoll"
  to = "/destinations/asia/maldives/baa-atoll/"
  status = 301

[[redirects]]
  from = "/destinations/marrakech"
  to = "/destinations/africa/morocco/erg-chebbi/"
  status = 301

[[redirects]]
  from = "/destinations/kyoto"
  to = "/destinations/"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
